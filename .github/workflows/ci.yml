name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # freshness compares commit times
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: MCP stdio handshake
        run: python -c "import json,subprocess,sys; p=subprocess.run([sys.executable,'projtruth/mcp_server.py'],input=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list'})+'\n',capture_output=True,text=True); d=json.loads(p.stdout.splitlines()[0]); assert len(d['result']['tools'])==8, d; print('mcp ok')"
      - name: Dogfood (this repo's own truth table is the gate)
        run: |
          python -m projtruth init
          python -m projtruth report --strict
        shell: bash
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
